name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kernel-l2:
    name: Boot L2 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc-13-aarch64-linux-gnu=13.3.0-6ubuntu2~24.04.1cross1 \
            gcc-aarch64-linux-gnu=4:13.2.0-7ubuntu1 \
            binutils-aarch64-linux-gnu=2.42-4ubuntu2.10 \
            make=4.3-4.1build2 \
            bc=1.07.1-3ubuntu4 \
            bison=2:3.8.2+dfsg-1ubuntu0.24.04.1 \
            flex=2.6.4-8.2build1 \
            libssl-dev=3.0.13-0ubuntu3.16 \
            libelf-dev=0.190-1.1ubuntu0.1 \
            libc6-dev-arm64-cross=2.39-0ubuntu8cross1 \
            device-tree-compiler=1.7.0-2build1
      - name: Build locked MiSeed CSOT boot image (L2)
        run: bash tools/build_kernel_l2.sh

  repository:
    name: Repository (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-2025
            python: '3.14'
          - os: macos-26
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check repository (L0)
        run: python -X utf8 tools/check_repo.py
      - name: Offline regression (L1)
        run: python -X utf8 -m unittest discover -s tests -v

  commits:
    name: PR commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14'
      - name: Check new commits and whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/check_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
