%YAML 1.2
---
$id: http://devicetree.org/schemas/net/nfc/nxp,sn100t.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP SN100T NFC controller

maintainers:
  - Ben <Ben8368@vip.qq.com>

description: |
  SN100T communicates over I2C using NCI. VEN supplies both NFCC and eSE;
  it must not be treated as an independent NFCC reset. This transport uses
  resident firmware only and does not implement eSE access or firmware
  download. CLKREQ routing is board pin configuration, not a host output.

properties:
  compatible:
    const: nxp,sn100t
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
    description: Active-high level interrupt asserted while data is available.
  enable-gpios:
    maxItems: 1
    description: Active-high VEN shared by NFCC and eSE; retain when NFC closes.
  firmware-gpios:
    maxItems: 1
    description: Active-high firmware download selection; normal mode is low.

required:
  - compatible
  - reg
  - interrupts
  - enable-gpios
  - firmware-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        nfc@28 {
            compatible = "nxp,sn100t";
            reg = <0x28>;
            interrupt-parent = <&gpio>;
            interrupts = <111 IRQ_TYPE_LEVEL_HIGH>;
            enable-gpios = <&gpio 83 GPIO_ACTIVE_HIGH>;
            firmware-gpios = <&gpio 110 GPIO_ACTIVE_HIGH>;
        };
    };
