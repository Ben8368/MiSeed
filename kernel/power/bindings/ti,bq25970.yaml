%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/ti,bq25970.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments BQ25970 switched capacitor charger

maintainers:
  - Ben <Ben8368@vip.qq.com>

description: |
  The BQ25970 is an I2C controlled switched capacitor charger with ADC and
  protection monitoring. This binding describes the standalone chip and its
  optional fault interrupt. It does not describe USB PD negotiation or a
  particular board charging policy. Other BQ2597x variants are not compatible.

properties:
  compatible:
    const: ti,bq25970

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        charger@66 {
            compatible = "ti,bq25970";
            reg = <0x66>;
            interrupt-parent = <&gpio>;
            interrupts = <68 IRQ_TYPE_EDGE_FALLING>;
        };
    };
