# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/xiaomi,umi-bq25970.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi Umi wired BQ25970 PPS charger

maintainers:
  - Ben <Ben8368@vip.qq.com>

description: |
  Xiaomi Umi standalone TI BQ25970 wired charge pump and qualified board policy.
  This is not a generic BQ2597x, wireless charger, or clone binding. The fixed
  limits and thermistor topology are specific to the reviewed Umi profile.
  TCPM supplies the USB input; the FG supplies telemetry; SMB5 is the mutually
  exclusive parallel charger. Both chargers physically charge the same battery.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: xiaomi,umi-bq25970
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  power-supplies:
    maxItems: 1
  xiaomi,switch-charger:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Parallel wired PM8150B charger requiring exclusive handoff.
  xiaomi,fuel-gauge:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Fuel gauge providing battery telemetry, not the battery description.
  '#thermal-sensor-cells':
    const: 0
  '#cooling-cells':
    const: 2
  io-channels:
    maxItems: 5
  io-channel-names:
    items:
      - const: cam_therm1
      - const: conn_therm
      - const: quiet_therm
      - const: wireless_therm
      - const: xo_therm
  xiaomi,thermal-board-compensation-millicelsius:
    description: Only the observed uncompensated board model is qualified.
    const: 0
  ti,bat-ovp-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Fixed protection setting from the qualified Umi wired profile.
    const: 4550
  ti,bat-ovp-alarm-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Fixed protection setting from the qualified Umi wired profile.
    const: 4525
  ti,bus-ovp-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Fixed protection setting from the qualified Umi wired profile.
    const: 12000
  ti,bus-ovp-alarm-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Fixed protection setting from the qualified Umi wired profile.
    const: 11000
  ti,bus-ocp-milliamp:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Fixed protection setting from the qualified Umi wired profile.
    const: 3750
  ti,bus-ocp-alarm-milliamp:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Fixed protection setting from the qualified Umi wired profile.
    const: 3500
  ti,ac-ovp-volt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Fixed protection setting from the qualified Umi wired profile.
    const: 14

required:
  - compatible
  - reg
  - interrupts
  - power-supplies
  - xiaomi,switch-charger
  - xiaomi,fuel-gauge
  - '#thermal-sensor-cells'
  - '#cooling-cells'
  - io-channels
  - io-channel-names
  - xiaomi,thermal-board-compensation-millicelsius
  - ti,bat-ovp-millivolt
  - ti,bat-ovp-alarm-millivolt
  - ti,bus-ovp-millivolt
  - ti,bus-ovp-alarm-millivolt
  - ti,bus-ocp-milliamp
  - ti,bus-ocp-alarm-milliamp
  - ti,ac-ovp-volt

additionalProperties: false
