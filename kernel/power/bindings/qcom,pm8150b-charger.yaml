# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B wired battery charger

maintainers:
  - Ben <Ben8368@vip.qq.com>

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: qcom,pm8150b-charger
  reg:
    maxItems: 1
  interrupts:
    maxItems: 4
  interrupt-names:
    items:
      - const: usbin-plugin
      - const: bat-ov
      - const: wdog-bark
      - const: usbin-icl-change
  io-channels:
    maxItems: 2
  io-channel-names:
    items:
      - const: usb_in_i_uv
      - const: usb_in_v_div_16
  monitored-battery: true
  qcom,fuel-gauge:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Telemetry provider, not a source supplying power to this charger.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names
  - monitored-battery
  - qcom,fuel-gauge

additionalProperties: false
